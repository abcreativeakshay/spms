# Render blueprint for the FastAPI API (the React client is deployed on Netlify).
#
# Usage: Render dashboard -> New -> Blueprint -> pick this repository.
# Then fill the two secret values marked `sync: false`:
#   GOOGLE_APPLICATION_CREDENTIALS_JSON  full service-account JSON, one line
#   CORS_ORIGINS                         https://<your-site>.netlify.app
#
# Free instances sleep after 15 minutes idle; the first request after a pause is slow.
services:
  - type: web
    name: spms-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: USE_FIREBASE
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: placement-app-144e3
      - key: FIREBASE_STORAGE_BUCKET
        value: placement-app-144e3.firebasestorage.app
      - key: FIRESTORE_WARM_CACHE
        value: "true"
      - key: FIRESTORE_CACHE_TTL_SECONDS
        value: "30"
      - key: FIREBASE_CHECK_REVOKED
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
